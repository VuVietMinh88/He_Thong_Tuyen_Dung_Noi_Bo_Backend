# Local development credentials only; do not use in production.
services:
  postgres:
    image: postgres:16
    container_name: recruitment-postgres
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment123
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recruitment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment -d recruitment"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  recruitment_postgres_data:
    name: recruitment_postgres_data
