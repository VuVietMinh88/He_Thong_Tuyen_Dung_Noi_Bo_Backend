spring.application.name=ttcs-backend
spring.config.import=optional:file:.env[.properties]
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recruitment}
spring.datasource.username=${DB_USERNAME:ttcs}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# One application, two immutable historical migration paths. New databases default to s5.
# Existing databases must keep the lineage recorded in V26/V27; see docs/database/migration-lineages.md.
app.migration.lineage=${APP_MIGRATION_LINEAGE:s5}

# Time zone of business dates such as "today" for the needed-by date of a requisition. Timestamps stay in UTC.
app.business-zone=Asia/Ho_Chi_Minh
# Task 356: marks PUBLISHED job postings past their application deadline as EXPIRED, every day at 00:05 in
# app.business-zone (Spring cron: second minute hour day month weekday). "-" turns it off.
app.job-posting-expiry.cron=${JOB_POSTING_EXPIRY_CRON:0 5 0 * * *}

# Receipt/outbox and IP quota integrations are also required before accepting public applications.
app.application-intake.enabled=${APPLICATION_INTAKE_ENABLED:false}
app.application-intake.max-concurrent=${APPLICATION_INTAKE_MAX_CONCURRENT:2}
# Preserve the socket peer; only the quota's explicitly trusted proxies may supply X-Forwarded-For.
server.forward-headers-strategy=NONE
app.application-intake.trusted-proxies=${APPLICATION_INTAKE_TRUSTED_PROXIES:}
# Task 339: public lookup by tracking code and email. Attempts per IPv4 address or IPv6 /64 in a sliding 60 minutes
# (1..1000), concurrent tracking requests per process (1..16), and how often idle buckets are removed. The client
# address comes from the same trusted proxies as the intake.
app.application-tracking.max-attempts=${APPLICATION_TRACKING_MAX_ATTEMPTS:30}
app.application-tracking.max-concurrent=${APPLICATION_TRACKING_MAX_CONCURRENT:4}
app.application-tracking.cleanup-delay-ms=${APPLICATION_TRACKING_CLEANUP_DELAY_MS:60000}

app.auth.jwt-secret=${AUTH_JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cv-extraction.enabled=${CV_EXTRACTION_ENABLED:false}
app.cv-extraction.max-pending=${CV_EXTRACTION_MAX_PENDING:100}
app.cv-contact-confirmation.enabled=${CV_CONTACT_CONFIRMATION_ENABLED:false}

# Default SMTP target is a local mail catcher. Production values belong in .env.
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
# Port 465 uses implicit TLS: set MAIL_SMTP_SSL=true and MAIL_SMTP_STARTTLS=false.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
# Reject a TLS certificate whose name does not match MAIL_HOST instead of sending over an unverified link.
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset.mail-from=${MAIL_FROM:support@internal-hire.com}
# Neutral name for new mail flows; keeps existing password-reset property overrides compatible.
app.mail.from=${app.password-reset.mail-from}
app.application-confirmation.page-url=${APPLICATION_TRACKING_PAGE_URL:http://localhost:5173/tra-cuu}
# Empty key leaves receipt intake unavailable even when its flag is enabled. Never generate a startup key.
app.application-confirmation.encryption-key=${APPLICATION_CONFIRMATION_ENCRYPTION_KEY:}
app.application-confirmation.key-id=${APPLICATION_CONFIRMATION_KEY_ID:v1}
# Interview invitations: enable queueing separately from actual SMTP delivery. Key must be separate AES-256.
app.interview-invitation.enabled=${INTERVIEW_INVITATIONS_ENABLED:false}
app.interview-invitation.delivery-enabled=${INTERVIEW_INVITATIONS_DELIVERY_ENABLED:false}
app.interview-invitation.encryption-key=${INTERVIEW_INVITATION_ENCRYPTION_KEY:}
app.interview-invitation.key-id=${INTERVIEW_INVITATION_KEY_ID:v1}
app.interview-invitation.page-url=${INTERVIEW_INVITATION_PAGE_URL:http://localhost:8080/api/v1/public/interview-invitations/reply}
app.interview-invitation.time-zone=${INTERVIEW_INVITATION_TIME_ZONE:Asia/Ho_Chi_Minh}
app.interview-invitation.poll-delay-ms=${INTERVIEW_INVITATION_POLL_DELAY_MS:60000}
# Task 346: emails after a candidate withdraws (V35 outbox). How often the worker looks for due emails, how long a
# recruiter notice waits so the withdrawals of one requisition go out in one mail (0..3600 s), and the staff page of a
# candidate profile the recruiter mail links to (HTTPS; HTTP only on loopback; no query or fragment).
app.application-notice.poll-delay-ms=${APPLICATION_NOTICE_POLL_DELAY_MS:10000}
app.application-notice.recruiter-delay-seconds=${APPLICATION_NOTICE_RECRUITER_DELAY_SECONDS:900}
app.candidate-profile.page-url=${CANDIDATE_PROFILE_PAGE_URL:http://localhost:5173/candidates}
# Task 351: staff referrals (POST /api/v1/referrals). Referral forms read at once per backend process (1..8), and
# referral attempts per referrer in 24 hours (1..100); a 404 or 409 counts too. Needs only the confirmation key above.
app.referral.max-concurrent=${REFERRAL_MAX_CONCURRENT:2}
app.referral.max-per-day=${REFERRAL_MAX_PER_DAY:20}
app.password-reset.page-url=${RESET_PASSWORD_PAGE_URL:http://localhost:5173/reset-password}
app.account-activation.page-url=${ACCOUNT_ACTIVATION_PAGE_URL:http://localhost:5173/activate-account}
app.account-activation.ttl=${ACCOUNT_ACTIVATION_TTL:24h}
# Footer of the account emails (password reset, account activation): who to contact for help, the company name
# and an optional logo (MailLayout, checked at startup). Keep the same values as VITE_COMPANY_NAME and
# VITE_SUPPORT_* of the frontend. Spring reads .properties files, .env included, as ISO-8859-1, so Vietnamese
# letters are written as Unicode escapes (backslash, u, 4 hex digits). An empty phone leaves it out of the email.
app.mail.company-name=${MAIL_COMPANY_NAME:H\u1ec7 th\u1ed1ng tuy\u1ec3n d\u1ee5ng n\u1ed9i b\u1ed9}
app.mail.support-team=${MAIL_SUPPORT_TEAM:B\u1ed9 ph\u1eadn Nh\u00e2n s\u1ef1}
app.mail.support-email=${MAIL_SUPPORT_EMAIL:support@internal-hire.com}
app.mail.support-phone=${MAIL_SUPPORT_PHONE:}
# Logo in the email header, embedded in each email (no remote image): a classpath: or local file: location such as
# classpath:mail/logo.png or file:/opt/ttcs/mail-logo.png, a PNG or JPEG of at most 200 KB. Empty shows the company
# name as text instead.
app.mail.logo=${MAIL_LOGO:}

# File uploads (multipart/form-data). A company logo or introduction image is at most 5 MB (CompanyMedia);
# the request limit leaves room for the other form fields. A bigger file gets HTTP 413 FILE_TOO_LARGE.
# The avatar API checks its own 2MB limit and answers 413 AVATAR_TOO_LARGE; keep max-file-size at least 5MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Uploads of up to 2 MB stay in memory instead of temporary files: the staff import .xlsx file (at most 2 MB,
# checked by StaffImportService) holds personal data.
spring.servlet.multipart.file-size-threshold=2MB
# A request above 6 MB is refused before its body is read. Tomcat then reads and drops the unread body so the
# client still receives the 413; above this size (Tomcat default 2MB) it closes the connection instead and the
# client sees a network error. 20MB covers ordinary phone photos while keeping that work bounded for every API.
server.tomcat.max-swallow-size=20MB

# Offers: queueing and SMTP delivery are separate opt-in switches; use an independent AES-256 key.
app.offers.enabled=${OFFERS_ENABLED:false}
app.offers.delivery-enabled=${OFFERS_DELIVERY_ENABLED:false}
app.offers.encryption-key=${OFFER_ENCRYPTION_KEY:}
app.offers.key-id=${OFFER_KEY_ID:v1}
app.offers.page-url=${OFFER_PAGE_URL:http://localhost:8080/api/v1/public/offers/reply}
app.offers.time-zone=${OFFER_TIME_ZONE:Asia/Ho_Chi_Minh}
app.offers.poll-delay-ms=${OFFER_POLL_DELAY_MS:60000}
app.offers.max-concurrent=${OFFER_MAX_CONCURRENT:4}
app.offers.expiry-delay-ms=${OFFER_EXPIRY_DELAY_MS:60000}

# Messaging lane (tasks 531-551, 418-420). Task 538: rejection letters and thank-you emails (candidate mail queue).
# Delivery can be paused without losing queued emails.
app.candidate-mail.delivery-enabled=${CANDIDATE_MAIL_DELIVERY_ENABLED:true}
app.candidate-mail.poll-delay-ms=${CANDIDATE_MAIL_POLL_DELAY_MS:60000}
# Task 544: how often committed notification events become in-app notifications.
app.notifications.poll-delay-ms=${NOTIFICATIONS_POLL_DELAY_MS:5000}
# Task 551: the email copy of notifications (channel preferences). Delivery is opt-in like the other optional mail
# flows; while it is off no copies are kept. A copy older than the maximum age when the worker reaches it is cancelled
# (EXPIRED) instead of being sent late.
app.notifications.email-delivery-enabled=${NOTIFICATION_EMAIL_DELIVERY_ENABLED:false}
app.notifications.email-poll-delay-ms=${NOTIFICATION_EMAIL_POLL_DELAY_MS:60000}
app.notifications.email-max-age=${NOTIFICATION_EMAIL_MAX_AGE:24h}
# Task 419: the daily SLA check (Spring cron in app.business-zone; "-" turns it off).
app.sla.cron=${SLA_CRON:0 0 7 * * *}
