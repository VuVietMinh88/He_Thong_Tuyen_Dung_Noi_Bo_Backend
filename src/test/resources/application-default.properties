# Task 356: test settings, read only when no Spring profile is active, which is every test here. They add to
# src/main/resources/application.properties and are never packaged. The daily job posting expiry
# (JobPostingExpiry.runDaily) must never start by itself while a test moves the clock: tests call expireDue() or
# expire(id) themselves. A test that activates a profile does not read this file and must set the property itself.
app.job-posting-expiry.cron=-
# Task 413: the fit result refresh (FitRefreshWorker) never runs by itself either; tests call refreshStale().
app.fit-scoring.refresh-cron=-
# Task 538: the candidate mail worker (CandidateMailWorker.poll) does not poll in tests, so it never takes rows or
# locks while a test resets the database; tests that need it call processNext().
app.candidate-mail.poll-delay-ms=3600000
# Task 544: nor does the notification worker (NotificationWorker.poll), which locks events and reads accounts and
# approvals; tests call processNext().
app.notifications.poll-delay-ms=3600000
